<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leads">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Leads</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fff; --ink:#0a0f0c; --muted:#9aa5a0; --faint:#c8d0cc;
  --teal:#0d9a91;
  --card:#f6f9f7; --card2:#eef4f0;
  --green:#0ec46a; --green-ink:#08a457; --wa:#25d366; --danger:#ff3b30;
  --r:20px; --ease:cubic-bezier(.22,1,.36,1);
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h1{font-size:20px;font-weight:640;margin:0;letter-spacing:-.02em}
.hide{display:none!important}

/* views */
.view{display:none;padding:0 14px 40px;max-width:620px;margin:0 auto}
.view.on{display:block;animation:in .3s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.view.on.back{animation:inb .3s var(--ease) both}
@keyframes inb{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

/* top bar */
.top{display:flex;align-items:center;gap:6px;padding:8px 0 4px;min-height:60px}
.ghost{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--ink);
  transition:background .18s ease,transform .12s ease}
.ghost:active{background:var(--card);transform:scale(.92)}
.title{font-size:19px;font-weight:640;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* list rows */
.list{display:flex;flex-direction:column;gap:10px;margin-top:70px}
.list.still .row{animation:none}      /* background sync: update in place, no re-entry animation */
.view#cat .list{margin-top:6px}
.row{background:var(--card);border-radius:var(--r);display:flex;align-items:center;gap:12px;
  padding:16px 16px;animation:row .34s var(--ease) both;transition:transform .14s var(--ease),background .18s ease}
@keyframes row{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.row:active{transform:scale(.977);background:var(--card2)}
.row .grow{flex:1;min-width:0}
.cname{font-size:17px;font-weight:600;letter-spacing:-.01em;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bname{font-size:17px;font-weight:600;letter-spacing:-.01em;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bname.rtl,.sh-input.rtl{direction:rtl;text-align:right;unicode-bidi:plaintext}
.bphone{display:block;color:var(--teal);font-size:14.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{color:var(--teal);font-size:14px;font-weight:600;min-width:14px;text-align:right;opacity:.75}
.tag{font-size:10.5px;font-weight:700;color:var(--teal);opacity:.7;border:1px solid var(--card2);
  border-radius:6px;padding:0 4px;margin-left:6px;vertical-align:1px;letter-spacing:.02em}
.empty{color:var(--teal);opacity:.6;font-size:13.5px;text-align:center;padding:70px 0}
/* trash sits last on the home list, quieter than the categories */
.row.trashrow{background:#fff;box-shadow:inset 0 0 0 1.5px var(--card2);margin-top:8px}
.row.trashrow:active{background:var(--card)}
.trashlabel{display:flex;align-items:center;gap:11px;color:var(--teal)}
.trashlabel .cname{color:var(--teal);font-weight:600}

/* icon buttons */
.ico{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;
  transition:transform .12s var(--ease),background .2s ease,color .2s ease}
.ico:active{transform:scale(.9)}
.copy{background:#fff;color:var(--muted);box-shadow:0 1px 3px rgba(10,20,15,.07)}
.copy.done{background:var(--green);color:#fff}
.wa{background:var(--wa);color:#fff;width:46px;height:46px;border-radius:16px}
.wa.busy{background:var(--card2);color:var(--wa)}
.wa .spin{display:none}
.wa.busy .glyph{display:none}
.wa.busy .spin{display:block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* fab */
.fab{position:fixed;top:calc(env(safe-area-inset-top) + 16px);right:16px;width:46px;height:46px;border-radius:16px;
  background:var(--green);color:#fff;display:grid;place-items:center;z-index:30;
  box-shadow:0 6px 18px rgba(14,196,106,.34);
  transition:transform .16s var(--ease),box-shadow .2s ease,background .2s ease}
.fab:active{transform:scale(.9);box-shadow:0 3px 10px rgba(14,196,106,.3)}

/* scrim + sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,10,.32);opacity:0;pointer-events:none;transition:opacity .28s ease;z-index:40;
  backdrop-filter:saturate(120%) blur(2px);-webkit-backdrop-filter:saturate(120%) blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;
  border-radius:26px 26px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .36s var(--ease);
  box-shadow:0 -8px 40px rgba(10,20,15,.14);max-height:92vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:3px;background:var(--faint);margin:4px auto 14px}
#cat .top{padding-right:124px}      /* keep clear of the two floating buttons */
#expBtn{margin-left:auto;width:42px;height:42px;border-radius:14px;background:var(--card);color:var(--teal)}
#expBtn:active{transform:scale(.94)}
.ico.snd{color:#fff;background:var(--teal)}
.ico.snd:active{transform:scale(.92)}
.sh-title{font-size:17px;font-weight:640;letter-spacing:-.02em;margin:2px 0 14px}
.sh-label{font-size:12.5px;color:var(--teal);margin:0 0 6px 4px;font-weight:600;letter-spacing:.01em}
.sh-input{width:100%;border:0;background:var(--card);border-radius:16px;padding:16px;font:inherit;font-size:17px;color:var(--ink);
  outline:none;margin-bottom:12px;transition:background .18s ease,box-shadow .18s ease}
.sh-input::placeholder{color:var(--faint)}
.sh-input:focus{background:var(--card2);box-shadow:0 0 0 2px rgba(14,196,106,.28)}
.sh-input.err{background:#fff5f4;box-shadow:0 0 0 2px rgba(255,59,48,.38)}
.sh-btn{width:100%;height:54px;border-radius:17px;background:var(--green);color:#fff;font-size:17px;font-weight:640;
  letter-spacing:-.01em;display:grid;place-items:center;transition:transform .14s var(--ease),background .2s ease}
.sh-btn:active{transform:scale(.98);background:var(--green-ink)}
.sh-btn.ghost{background:var(--card);color:var(--muted)}
.sh-btn.danger{background:#fff;color:var(--danger)}
.sh-row{display:flex;align-items:center;gap:14px;padding:17px 6px;font-size:17px;font-weight:600;border-radius:16px;
  animation:row .3s var(--ease) both;transition:background .16s ease}
.sh-row:active{background:var(--card)}
.sh-row.danger{color:var(--danger)}
.sh-row svg{flex:none;opacity:.85}
.sh-sub{font-size:14px;color:var(--muted);font-weight:400;margin:0 0 18px;padding:0 6px;line-height:1.4}

/* find view: businesses pulled from Google Places (area + keyword) with their phone numbers */
.fab.find{right:74px;background:var(--teal);box-shadow:0 6px 18px rgba(13,154,145,.3)}
.fab.find:active{box-shadow:0 3px 10px rgba(13,154,145,.3)}
.fsub{color:var(--muted);font-size:13.5px;font-weight:600;padding:0 4px 4px;margin:0}
.view#find .list{margin-top:6px}
.ico.add{background:var(--green);color:#fff;width:46px;height:46px;border-radius:16px}
.ico.add.done{background:var(--card2);color:var(--green-ink)}
.row.dim{background:#fff;box-shadow:inset 0 0 0 1.5px var(--card2);opacity:.55}
.row.dim .bphone{color:var(--faint)}
.chips{display:flex;gap:8px;margin:0 0 14px}
.chip{flex:1;height:46px;border-radius:15px;background:var(--card);color:var(--muted);font-size:15px;font-weight:600;
  transition:background .18s ease,color .18s ease,transform .12s var(--ease)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--teal);color:#fff}
.morebtn{width:100%;height:50px;border-radius:16px;background:var(--card);color:var(--teal);
  font-size:16px;font-weight:640;margin-top:12px;transition:transform .12s var(--ease)}
.morebtn:active{transform:scale(.98)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
  background:rgba(10,15,12,.92);color:#fff;font-size:14.5px;font-weight:600;padding:11px 18px;border-radius:15px;
  opacity:0;pointer-events:none;transition:opacity .22s ease,transform .28s var(--ease);z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- HOME : categories -->
<main class="view on" id="home">
  <div class="list" id="cats"></div>
</main>

<!-- CATEGORY : businesses -->
<main class="view" id="cat">
  <div class="top">
    <button class="ghost" id="back" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 class="title" id="catName"></h1>
    <button class="ghost exp" id="expBtn" aria-label="Export">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>
    </button>
  </div>
  <div class="list" id="biz"></div>
</main>

<button class="fab" id="fab" aria-label="Add">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<button class="fab find" id="fabFind" aria-label="Find numbers">
  <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.2 16.2L21 21"/></svg>
</button>

<!-- FIND : businesses with numbers, from Google Places search -->
<main class="view" id="find">
  <div class="top">
    <button class="ghost" id="findBack" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 class="title" id="findTitle"></h1>
  </div>
  <div class="fsub" id="findSub"></div>
  <div class="list" id="hits"></div>
  <button class="morebtn hide" id="findMore">More</button>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
(function(){
'use strict';

/* ---------- icons ---------- */
var I = {
  copy:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="3"/><path d="M6 15H5a2 2 0 01-2-2V5a2 2 0 012-2h8a2 2 0 012 2v1"/></svg>',
  check:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5L20 6.5"/></svg>',
  wa:'<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.347-.347.52-.52.174-.174.232-.298.347-.497.116-.198.058-.372-.03-.52-.086-.148-.66-1.59-.905-2.17-.24-.575-.48-.5-.66-.51h-.56c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.71.306 1.263.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.29.173-1.414-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>',
  spin:'<svg class="spin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 3a9 9 0 109 9" opacity=".9"/></svg>',
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  pencil:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16v4z"/></svg>',
  trash:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>'
};
var WA_GLYPH = I.wa.replace('<svg ','<svg class="glyph" ');
I.send = '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10.5 13.5"/><path d="M21 3l-6.8 18-3.7-7.5L3 9.8 21 3z"/></svg>';

/* ---------- store ---------- */
var KEY = 'leads.v1';
var TRASH = '__trash';   // pseudo-category for numbers already messaged
var MSG_VERSION = 3;     // raise this whenever the prompt changes -> stored messages get rewritten
var S = load();
var cur = null;          // open category id
var lastSig = '';        // last rendered state, so a background sync only redraws on real change
var backAnim = false;

function blank(){ return { cats:{}, biz:{}, order:[] }; }
function load(){
  try{
    var r = JSON.parse(localStorage.getItem(KEY));
    if(r && typeof r === 'object'){
      var s = blank();
      s.cats  = (r.cats && typeof r.cats === 'object') ? r.cats : {};
      s.biz   = (r.biz  && typeof r.biz  === 'object') ? r.biz  : {};
      s.order = Array.isArray(r.order) ? r.order.filter(function(id){ return s.cats[id]; }) : Object.keys(s.cats);
      Object.keys(s.cats).forEach(function(id){ if(s.order.indexOf(id) < 0) s.order.push(id); });
      return s;
    }
  }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function isRTL(s){ return /[\u0600-\u06FF]/.test(s || ''); }
// Google Maps copy-paste carries invisible RTL/LTR marks (U+200F, U+202A-U+202E, U+2066-U+2069),
// which corrupt the display and any copy of the row. Strip them on the way in.
function clean(s){
  return String(s == null ? '' : s)
    .replace(/[\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms || 8); }catch(e){} }
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('on'); }, 900);
}

/* ---------- views ---------- */
function show(id, back){
  var views = document.querySelectorAll('.view');
  for(var i=0;i<views.length;i++){
    var v = views[i];
    v.classList.remove('on','back');
    if(v.id === id){ void v.offsetWidth; v.classList.add('on'); if(back) v.classList.add('back'); }
  }
  var ff = document.getElementById('fabFind');
  if(ff) ff.classList.toggle('hide', id !== 'home' && id !== 'cat');
}
function releaseRows(){
  // Safety net: rows animate in, but must never depend on the animation to become visible
  // (a page rendered while hidden can leave them at opacity 0).
  setTimeout(function(){
    var rs = document.querySelectorAll('.row');
    for(var i = 0; i < rs.length; i++) rs[i].style.animation = 'none';
  }, 450);
}
function renderHome(){
  var rows = S.order.map(function(id){ return S.cats[id]; }).filter(Boolean);
  var html = rows.length ? rows.map(function(c,i){
    var n = Object.keys(S.biz).filter(function(b){ return S.biz[b].categoryId === c.id && !S.biz[b].movedAt; }).length;
    return '<div class="row" data-open="'+c.id+'" style="animation-delay:'+Math.min(i*20,220)+'ms">'+
      '<span class="grow"><span class="cname'+(isRTL(c.name)?' rtl':'')+'">'+esc(c.name)+'</span></span>'+
      '<span class="cnt num">'+(n||'')+'</span>'+
      '<button class="ico copy" data-copy="'+c.id+'" aria-label="Copy">'+I.copy+'</button>'+
    '</div>';
  }).join('') : '<div class="empty">Empty</div>';
  // Trash always sits last on the home list: numbers already messaged on WhatsApp.
  var t = trashCount();
  html += '<div class="row trashrow" data-trash="1" style="animation-delay:'+Math.min(rows.length*20+40,320)+'ms">'+
      '<span class="grow trashlabel">'+I.trash+'<span class="cname">Trash</span></span>'+
      '<span class="cnt num">'+(t||'')+'</span>'+
    '</div>';
  document.getElementById('cats').innerHTML = html;
  releaseRows();
}
function trashCount(){ return Object.keys(S.biz).filter(function(b){ return !!(S.biz[b] && S.biz[b].movedAt); }).length; }
function bizRow(b, i){
  return '<div class="row" data-edit="'+b.id+'" style="animation-delay:'+Math.min((i||0)*20,220)+'ms">'+
    '<span class="grow"><span class="bname'+(isRTL(b.name)?' rtl':'')+'">'+esc(b.name)+'</span>'+
    '<span class="bphone num">'+esc(b.phone)+'</span></span>'+
    '<button class="ico snd" data-send="'+b.id+'" aria-label="Send with WA Hero">'+I.send+I.spin+'</button>'+
    '<button class="ico wa" data-wa="'+b.id+'" aria-label="WhatsApp">'+WA_GLYPH+I.spin+'</button>'+
  '</div>';
}
function renderBiz(){
  var c = S.cats[cur]; if(!c) return;
  document.getElementById('catName').textContent = c.name;
  document.getElementById('catName').classList.toggle('rtl', isRTL(c.name));
  var rows = Object.keys(S.biz).filter(function(b){ return S.biz[b].categoryId === cur && !S.biz[b].movedAt; })
    .map(function(b){ return S.biz[b]; })
    .sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
  document.getElementById('biz').innerHTML = rows.length ? rows.map(bizRow).join('') : '<div class="empty">Empty</div>';
  releaseRows();
}
function renderTrash(){
  document.getElementById('catName').textContent = 'Trash';
  document.getElementById('catName').classList.remove('rtl');
  var rows = Object.keys(S.biz).filter(function(b){ return S.biz[b].movedAt; })
    .map(function(b){ return S.biz[b]; })
    .sort(function(a,b){ return (b.movedAt||0) - (a.movedAt||0); });
  document.getElementById('biz').innerHTML = rows.length ? rows.map(bizRow).join('') : '<div class="empty">Empty</div>';
  releaseRows();
}
function rerender(quiet){
  var sig = JSON.stringify(S);
  if(quiet && sig === lastSig) return;        // nothing changed: don't touch the DOM at all
  var lists = [document.getElementById('cats'), document.getElementById('biz')];
  for(var k = 0; k < lists.length; k++) lists[k].classList.toggle('still', !!quiet);
  if(cur === TRASH) renderTrash(); else if(cur) renderBiz();
  renderHome();
  lastSig = JSON.stringify(S);
}

/* ---------- sheet ---------- */
var sheetEl = document.getElementById('sheet');
var scrim   = document.getElementById('scrim');
var sheetOpen = false;
function openSheet(html, focus){
  sheetEl.innerHTML = '<div class="grab"></div>' + html;
  scrim.classList.add('on');
  void sheetEl.offsetWidth;
  sheetEl.classList.add('on');
  sheetOpen = true;
  if(focus){ setTimeout(function(){ var f = sheetEl.querySelector('input'); if(f) f.focus(); }, 200); }
}
function closeSheet(){
  if(!sheetOpen) return;
  sheetOpen = false;
  sheetEl.classList.remove('on'); scrim.classList.remove('on');
  setTimeout(function(){ if(!sheetOpen) sheetEl.innerHTML = ''; }, 340);
  syncSoon();
}
scrim.addEventListener('click', closeSheet);

function deleteCategory(id){
  var c = S.cats[id]; if(!c) return;
  var kids = Object.keys(S.biz).filter(function(b){ return S.biz[b].categoryId === id; });
  confirmDelete(kids.length ? 'Removes '+kids.length+' number'+(kids.length>1?'s':'') : 'This category', c.name, function(){
    kids.forEach(function(b){ delete S.biz[b]; cloud.drop('businesses', b); });
    delete S.cats[id];
    S.order = S.order.filter(function(x){ return x !== id; });
    save(); cloud.drop('categories', id);
    renderHome();
    if(cur === id){ cur = null; show('home', true); }
  });
}
function bizSheet(id, categoryId){
  var b = id ? S.biz[id] : null;
  openSheet('<div class="sh-title">'+(b ? 'Edit' : 'New number')+'</div>'+
    '<input class="sh-input'+(b && isRTL(b.name)?' rtl':'')+'" id="shBizName" placeholder="Name" autocomplete="off" enterkeyhint="next" value="'+(b?esc(b.name):'')+'">'+
    '<input class="sh-input num" id="shPhone" type="tel" inputmode="tel" placeholder="Phone number" autocomplete="off" enterkeyhint="done" value="'+(b?esc(b.phone):'')+'">'+
    '<button class="sh-btn" id="shSave">Save</button>'+
    (b ? '<div style="height:10px"></div><button class="sh-btn danger" id="shDel">Delete</button>' : ''), true);
  var nameEl = document.getElementById('shBizName');
  var phEl   = document.getElementById('shPhone');
  nameEl.addEventListener('input', function(){ nameEl.classList.toggle('rtl', isRTL(nameEl.value)); });
  function go(){
    var name = clean(nameEl.value), phone = clean(phEl.value);
    if(!name && !phone) return;
    if(phone && !validPhone(phone)){
      phEl.classList.add('err');
      setTimeout(function(){ phEl.classList.remove('err'); }, 900);
      buzz(24);
      toast('Start with 08 / 8');
      return;
    }
    var dup = phone ? findDup(phone, b ? b.id : null) : null;
    if(dup){
      phEl.classList.add('err');
      setTimeout(function(){ phEl.classList.remove('err'); }, 900);
      buzz(24);
      toast('Already in ' + catNameOf(dup.categoryId));
      return;
    }
    var target;
    if(b){
      var wasName = b.name;
      b.name = name; b.phone = phone;
      if(wasName !== name) b.msg = '';         // written for the old name -> rewrite it
      save(); rerender(); cloud.push('businesses', b);
      target = b;
    }else{
      var nb = { id: uid('b_'), name:name, phone:phone, categoryId:categoryId, createdAt:Date.now() };
      S.biz[nb.id] = nb; save(); rerender(); cloud.push('businesses', nb);
      target = nb;
    }
    closeSheet(); buzz();
    genMessage(target);          // written now, so tapping WhatsApp later is instant
  }
  document.getElementById('shSave').onclick = go;
  phEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') go(); });
  if(b){
    document.getElementById('shDel').onclick = function(){
      closeSheet();
      confirmDelete('This number', b.name || b.phone, function(){
        delete S.biz[b.id]; save(); rerender(); cloud.drop('businesses', b.id);
      });
    };
  }
}

/* ---------- whatsapp ---------- */
function normPhone(raw){
  var d = String(raw || '').replace(/\D/g,'');
  if(!d) return '';
  if(d.indexOf('620') === 0) d = '62' + d.slice(3);
  else if(d.indexOf('62') === 0) d = d;
  else if(d.charAt(0) === '0') d = '62' + d.slice(1);
  else if(d.charAt(0) === '8') d = '62' + d;
  return d;
}
function waUrl(phone, text){ return 'https://wa.me/' + normPhone(phone) + '?text=' + encodeURIComponent(text); }

/* ONE number, once — globally, even across different categories. */
function findDup(phone, exceptId){
  var k = normPhone(phone);
  if(!k) return null;
  var ids = Object.keys(S.biz);
  for(var i = 0; i < ids.length; i++){
    var b = S.biz[ids[i]];
    if(b.id !== exceptId && normPhone(b.phone) === k) return b;
  }
  return null;
}
function catNameOf(id){ return (S.cats[id] && S.cats[id].name) || 'another category'; }
// Indonesian mobile numbers only: 08… / 8… / +62 8…  (landlines such as 021… are refused)
function validPhone(raw){
  var d = String(raw || '').replace(/\D/g, '');
  if(d.indexOf('620') === 0) d = '62' + d.slice(3);
  if(d.indexOf('62') === 0) d = d.slice(2);
  else if(d.charAt(0) === '0') d = d.slice(1);
  return /^8\d{8,11}$/.test(d);
}
// Boot repair: strip invisible marks that came with a Google Maps copy-paste, and collapse
// duplicate numbers - the oldest entry wins. Both are written back to the cloud.
function tidy(){
  var dirty = false, drop = [], seen = {};
  Object.keys(S.cats).forEach(function(id){
    var c = S.cats[id], n = clean(c.name);
    if(n !== c.name){ c.name = n; dirty = true; if(n) cloud.push('categories', c); }
  });
  Object.keys(S.biz).sort(function(a, b){ return (S.biz[a].createdAt || 0) - (S.biz[b].createdAt || 0); })
    .forEach(function(id){
      var b = S.biz[id], n = clean(b.name), p = clean(b.phone), k = normPhone(p);
      if(n !== b.name || p !== b.phone){ b.name = n; b.phone = p; dirty = true; cloud.push('businesses', b); }
      if(!k) return;
      if(seen[k]) drop.push(id); else seen[k] = id;
    });
  drop.forEach(function(id){ delete S.biz[id]; cloud.drop('businesses', id); });
  if(dirty || drop.length) save();
  return drop.length;
}

function template(name, category){
  var t = String(category || ''), cat = t || 'usaha', benefit = 'profil usaha, foto, harga, lokasi, dan tombol WhatsApp';
  for(var i=0;i<BENEFIT.length;i++){ if(BENEFIT[i][0].test(t)){ cat = BENEFIT[i][1]; benefit = BENEFIT[i][2]; break; } }
  var who = name || cat;
  return 'Halo, saya dapat nomor ' + who + ' dari Google Maps. Saya bikin website untuk ' + cat + ' — isinya ' + benefit + '.\n\n' +
         'Kalau alamat website-nya pakai .com dengan nama ' + who + ' sendiri, usaha ini terlihat lebih resmi dan mudah diingat orang.\n\n' +
         'Soal biaya tidak perlu khawatir, semua bisa disesuaikan dengan budget Bapak/Ibu.\n\n' +
         'Kalau ada waktu sebentar, saya ingin tanya: website seperti apa yang Bapak/Ibu inginkan?';
}
/* The message is written when the number is added, not when WhatsApp is tapped - the tap
   then just opens wa.me with the text already inside. */
function genMessage(b){
  if(!b || !b.name) return Promise.resolve();
  if(b.msg && b.msgv === MSG_VERSION) return Promise.resolve();
  return fetch('/api/message', {
    method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({ name:b.name, category:catNameOf(b.categoryId) })
  }).then(function(r){ return r.json(); }).then(function(j){
    // Only a real AI message is worth storing. A template reply means the models were
    // unavailable (or rate-limited) - leave it unset so the backlog retries later.
    if(j && typeof j.message === 'string' && j.message.trim() && j.source !== 'template'){
      b.msg = j.message.trim();
      b.msgv = MSG_VERSION;
      save(); cloud.push('businesses', b);
    }else if(j && j.reason === 'rate-limited'){
      genPausedUntil = Date.now() + 60000;    // back off instead of burning the quota
    }
  }).catch(function(){});          // offline: filled in by the backlog pass later
}
var genPausedUntil = 0;
// Anything still without a message gets one written in the background, a few at a time so it
// never competes with a tap and stays under the model's rate limit.
var genRunning = false;
function genBacklog(max){
  if(genRunning || !navigator.onLine || Date.now() < genPausedUntil) return;
  var ids = Object.keys(S.biz).filter(function(i){
    var b = S.biz[i];
    // already-messaged numbers keep the text they were sent with; no need to spend a call on them
    return b && b.name && !b.movedAt && (!b.msg || b.msgv !== MSG_VERSION);
  });
  if(!ids.length) return;
  genRunning = true;
  var i = 0, stop = Math.min(ids.length, max || 5);
  (function step(){
    if(i >= stop){ genRunning = false; return; }
    var b = S.biz[ids[i++]];
    if(!b){ step(); return; }
    genMessage(b).then(function(){ setTimeout(step, 400); });
  })();
}

function moveToTrash(b){
  if(!b || b.movedAt) return;
  b.movedAt = Date.now();
  save(); cloud.push('businesses', b); rerender();
}
// Send this one lead through WA Hero instead of opening WhatsApp. Only ever runs on a press,
// only ever sends to the number on that row, and uses the message already written for it.
function sendViaHero(id){
  var b = S.biz[id]; if(!b) return;
  var c = S.cats[b.categoryId];
  var msg = b.msg || template(b.name, c ? c.name : '');
  buzz(12);
  var btn = document.querySelector('[data-send="'+id+'"]');
  if(btn) btn.classList.add('busy');
  fetch('/api/send', {
    method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ phone: b.phone, message: msg })
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ return { ok:r.ok, j:j }; });
  }).then(function(o){
    if(btn) btn.classList.remove('busy');
    if(!o.ok) throw new Error((o.j && o.j.error) || 'failed');
    moveToTrash(b);                    // it has been messaged - same as the WhatsApp tap
    rerender();
    toast('Sent · ' + b.name);
  }).catch(function(e){
    if(btn) btn.classList.remove('busy');
    toast('Not sent: ' + e.message);
  });
}
function waSend(id){
  var b = S.biz[id]; if(!b) return;
  buzz(10);
  // Instant path: the message was written when the number was added (and is up to date).
  if(b.msg && b.msgv === MSG_VERSION){
    moveToTrash(b);
    location.href = waUrl(b.phone, b.msg);
    return;
  }
  // Outdated or missing text: write it now, once, then every later tap is instant.
  var c = S.cats[b.categoryId];
  var category = c ? c.name : '';
  var btn = sheetEl.querySelector ? document.querySelector('[data-wa="'+id+'"]') : null;
  if(btn) btn.classList.add('busy');
  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  var to = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 12000);
  var url = '/api/message';
  fetch(url, {
    method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({ name:b.name, category:category }),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function(r){ return r.json(); }).then(function(j){
    clearTimeout(to);
    var msg = (j && typeof j.message === 'string' && j.message.trim()) ? j.message.trim() : template(b.name, category);
    if(j && j.source !== 'template'){ b.msg = msg; b.msgv = MSG_VERSION; save(); cloud.push('businesses', b); }
    moveToTrash(b);                                   // messaged -> out of the category, into Trash
    location.href = waUrl(b.phone, msg);
  }).catch(function(){
    clearTimeout(to);
    if(btn) btn.classList.remove('busy');
    moveToTrash(b);
    location.href = waUrl(b.phone, template(b.name, category));
  });
}

/* ---------- cloud (Firestore REST + Firebase anonymous sign-in) ---------- */
var cloud = (function(){
  var CFG = (window.APP_CONFIG && window.APP_CONFIG.firebase) || {};
  var on = !!(CFG.apiKey && CFG.projectId && String(CFG.apiKey).indexOf('AIza') === 0);
  var BASE = on ? ('https://firestore.googleapis.com/v1/projects/' + CFG.projectId + '/databases/(default)/documents') : '';
  var KEYQ = on ? ('key=' + encodeURIComponent(CFG.apiKey)) : '';
  // The key must be appended last, after any path or query the call already carries.
  function url(path){ return BASE + path + (path.indexOf('?') >= 0 ? '&' : '?') + KEYQ; }
  var AUTHKEY = 'leads.auth';
  var auth = null, inflight = null;
  try{ auth = JSON.parse(localStorage.getItem(AUTHKEY)); }catch(e){ auth = null; }

  function storeAuth(a){ auth = a; try{ localStorage.setItem(AUTHKEY, JSON.stringify(a)); }catch(e){} }

  // Anonymous Firebase user: Firestore REST refuses a bare API key, it wants a real
  // identity, so sign in silently once and keep the token (refreshed) on the device.
  function authenticate(){
    if(auth && auth.token && auth.exp > Date.now() + 60000) return Promise.resolve(auth.token);
    if(inflight) return inflight;
    var url, body;
    if(auth && auth.refresh){
      url = 'https://securetoken.googleapis.com/v1/token?key=' + CFG.apiKey;
      body = { grant_type:'refresh_token', refresh_token: auth.refresh };
    }else{
      url = 'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + CFG.apiKey;
      body = { returnSecureToken:true };
    }
    inflight = fetch(url, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        var t = j.id_token || j.idToken, rt = j.refresh_token || j.refreshToken;
        var secs = Number(j.expires_in || j.expiresIn || 3600);
        if(!t) throw new Error('auth');
        storeAuth({ uid: j.user_id || j.localId || (auth && auth.uid), token:t, refresh:rt, exp: Date.now() + secs * 1000 });
        return t;
      });
    inflight.then(function(){ inflight = null; }, function(){ inflight = null; });
    return inflight;
  }
  function raw(path, opts, token){
    var h = { 'content-type':'application/json' };
    if(token) h.authorization = 'Bearer ' + token;
    return fetch(url(path), { method:opts.method || 'GET', headers:h, body:opts.body }).then(function(r){
      if(r.status === 401 || r.status === 403) return { denied:true };   // rules (or identity) said no
      if(!r.ok) throw new Error('http ' + r.status);
      return r.json().catch(function(){ return {}; });
    });
  }
  // Try the plain API key first (works when the rules are open); if Firestore refuses,
  // sign in anonymously and retry with the token.
  function api(path, opts){
    opts = opts || {};
    return raw(path, opts).then(function(res){
      if(!res.denied) return res;
      return authenticate().then(function(t){ return raw(path, opts, t); })
        .then(function(r2){ if(r2.denied) throw new Error('denied'); return r2; });
    });
  }

  function enc(o){
    var f = {};
    Object.keys(o).forEach(function(k){
      var v = o[k];
      if(typeof v === 'number') f[k] = { integerValue: String(Math.round(v)) };
      else f[k] = { stringValue: String(v == null ? '' : v) };
    });
    return { fields: f };
  }
  function dec(d){
    var o = {}, f = d.fields || {};
    Object.keys(f).forEach(function(k){
      var v = f[k];
      o[k] = ('integerValue' in v) ? Number(v.integerValue)
           : ('booleanValue' in v) ? v.booleanValue
           : ('stringValue'  in v) ? v.stringValue : '';
    });
    return o;
  }
  function idOf(name){ return String(name).split('/').pop(); }
  function nameOf(col, id){
    var fields = (col === 'categories') ? ['id','name','createdAt']
      : (col === 'scans') ? ['id','blob']
      : ['id','name','phone','categoryId','createdAt','movedAt','msg','msgv'];
    return '/' + col + '/' + id + '?' + fields.map(function(f){ return 'updateMask.fieldPaths=' + f; }).join('&');
  }

  // Every change is queued on the device first and flushed to Firestore in order, so a
  // lead collected with no signal is not lost - it goes up on the next connection.
  // Firestore's free tier counts every document read. Re-reading the whole list (hundreds of
  // documents) every 20 seconds burned a day's quota in about an hour, so the app now polls ONE
  // tiny document and only re-reads the list when something actually changed.
  var RKEY = 'leads.rev';
  function knownRev(){ return Number(localStorage.getItem(RKEY) || 0); }
  function setRev(n){ try{ localStorage.setItem(RKEY, String(n)); }catch(e){} }
  function rev(){
    if(!on) return Promise.resolve(null);
    return api('/meta/rev?mask.fieldPaths=n').then(function(j){
      var f = (j && j.fields && j.fields.n) || null;
      return f && ('integerValue' in f) ? Number(f.integerValue) : 0;
    }, function(){ return null; });          // unreadable: pull anyway
  }
  function bump(){
    if(!on) return Promise.resolve();
    var n = Date.now();
    return api('/meta/rev?updateMask.fieldPaths=n', { method:'PATCH', body:JSON.stringify(enc({ n:n })) })
      .then(function(){ setRev(n); }, function(){});
  }

  var QKEY = 'leads.queue';
  function qget(){ try{ return JSON.parse(localStorage.getItem(QKEY)) || []; }catch(e){ return []; } }
  function qset(a){ try{ localStorage.setItem(QKEY, JSON.stringify(a)); }catch(e){} }
  var flushing = false;

  function enqueue(op){
    if(!on) return;
    var a = qget();
    a.push(op);
    if(a.length > 80) a = a.slice(a.length - 80);   // never let one stuck write grow forever
    qset(a); flush();
  }
  function flush(){
    if(!on || flushing) return Promise.resolve();
    var a = qget();
    if(!a.length) return Promise.resolve();
    flushing = true;
    var op = a[0];
    var p = op.del
      ? api('/' + op.col + '/' + op.id, { method:'DELETE' })
      : api(nameOf(op.col, op.id), { method:'PATCH', body:JSON.stringify(enc(op.doc)) });
    return Promise.resolve(p).then(function(){
      var cur = qget(); cur.shift(); qset(cur); flushing = false;
      if(!cur.length) bump();         // queue empty: one tiny write tells the other device to re-read
      syncSoon();                     // our write landed - pull what other devices did meanwhile
      return flush();
    }, function(){
      flushing = false;      // still queued - retried on the next boot or reconnect
    });
  }
  window.addEventListener('online', function(){ flush(); });

  return {
    on: function(){ return on; },
    queue: function(){ return qget().length; },
    flush: flush,
    push: function(col, obj){
      var doc = (col === 'categories')
        ? { id:obj.id, name:obj.name, createdAt:obj.createdAt }
        : (col === 'scans')
        ? { id:'main', blob:String(obj.blob || '') }        // one doc: which places were scanned
        : { id:obj.id, name:obj.name, phone:obj.phone, categoryId:obj.categoryId, createdAt:obj.createdAt, movedAt:obj.movedAt || 0, msg:obj.msg || '', msgv:obj.msgv || 0 };
      enqueue({ col:col, id:(col === 'scans' ? 'main' : obj.id), doc:doc });
    },
    drop: function(col, id){
      enqueue({ col:col, id:id, del:true });
    },
    status: function(){ return api('/categories').then(function(){ return 'ok'; }, function(e){ return 'fail: ' + e.message; }); },
    rev: rev, knownRev: knownRev, bump: bump,
    pull: function(force){
      if(!on) return Promise.resolve(false);
      return (force ? Promise.resolve(true) : rev().then(function(r){
        if(r == null) return true;                 // unknown: fall back to a full read
        return r !== knownRev();                   // nothing changed anywhere? then do nothing
      })).then(function(changed){
        if(!changed) return false;
        return fullPull();
      });
    },
    fullPull: function(){
      var cats = {}, biz = {}, order = [];
      return api('/categories').then(function(j){
        (j.documents || []).forEach(function(d){ var c = dec(d); c.id = idOf(d.name); cats[c.id] = c; order.push(c.id); });
        return api('/businesses');
      }).then(function(k){
        (k.documents || []).forEach(function(d){ var b = dec(d); b.id = idOf(d.name); biz[b.id] = b; });
        return api('/scans');
      }).then(function(sc){
        // the scanned-places memory, shared by every device
        (sc.documents || []).forEach(function(d){
          var s = dec(d);
          if(idOf(d.name) === 'main' && s.blob) scanMerge(s.blob);
        });
        // Keep anything still waiting in the outbox (collected offline) visible, and keep
        // a queued delete from being resurrected by the server copy.
        qget().forEach(function(op){
          if(op.del){
            if(op.col === 'categories'){ delete cats[op.id]; order = order.filter(function(x){ return x !== op.id; }); }
            else delete biz[op.id];
            return;
          }
          if(!op.doc) return;
          if(op.col === 'categories'){ if(!cats[op.id]) order.push(op.id); cats[op.id] = op.doc; }
          else biz[op.id] = op.doc;
        });
        rev().then(function(r){ if(r != null) setRev(r); });   // remember where we are
        if(order.length || Object.keys(biz).length){
          order.sort(function(a, b){ return (cats[a].createdAt || 0) - (cats[b].createdAt || 0); });
          S = { cats:cats, biz:biz, order:order };
          save(); return true;
        }
        // cloud is empty -> first run, seed it from what is already on the phone
        S.order.forEach(function(cid){ if(S.cats[cid]) cloud.push('categories', S.cats[cid]); });
        Object.keys(S.biz).forEach(function(bid){ cloud.push('businesses', S.biz[bid]); });
        return false;
      }).catch(function(){ return false; });
    }
  };
})();

/* copy */
function copyText(text, btn){
  function done(){
    buzz(10); toast('Copied');
    if(btn){ btn.classList.add('done'); btn.innerHTML = I.check;
      setTimeout(function(){ btn.classList.remove('done'); btn.innerHTML = I.copy; }, 900); }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ legacy(text, done); });
  }else legacy(text, done);
}
function legacy(text, done){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta); done();
}


/* ---------- find: Google Places search for businesses with a number ---------- */
var FKEY = 'leads.find';
var F = { area:'', q:'', r:5000, lat:null, lng:null, label:'', items:[], more:false, from:null, pick:0, busy:false };
(function(){
  try{
    var f = JSON.parse(localStorage.getItem(FKEY) || '{}');
    if(!f || typeof f !== 'object') return;
    if(f.area) F.area = f.area;
    if(f.q) F.q = f.q;
    if(f.r) F.r = f.r;
    if(f.lat != null && f.lng != null){ F.lat = f.lat; F.lng = f.lng; F.label = f.label || ''; }
  }catch(e){}
})();
function saveFind(){
  try{ localStorage.setItem(FKEY, JSON.stringify({ area:F.area, q:F.q, r:F.r, lat:F.lat, lng:F.lng, label:F.label })); }catch(e){}
}

/* Every Google place this app has looked at, so no area is scanned twice. Kept on the phone and
   mirrored to Firestore (`scans/main`) so both devices share one memory. */
var SKEY = 'leads.scanned.v1';
var SCAN = { ids:{}, near:{}, done:{} };
(function(){
  try{
    var s = JSON.parse(localStorage.getItem(SKEY) || '{}');
    if(!s || typeof s !== 'object') return;
    SCAN.ids = (s.ids && typeof s.ids === 'object') ? s.ids : {};
    SCAN.near = (s.near && typeof s.near === 'object') ? s.near : {};
    SCAN.done = (s.done && typeof s.done === 'object') ? s.done : {};
  }catch(e){}
})();
function saveScan(){
  var keys = Object.keys(SCAN.ids);
  if(keys.length > 12000){                                  // keep the doc well under Firestore's limit
    var drop = keys.slice(0, keys.length - 12000);
    for(var i = 0; i < drop.length; i++) delete SCAN.ids[drop[i]];
  }
  try{ localStorage.setItem(SKEY, JSON.stringify(SCAN)); }catch(e){}
}
function scanIds(){ return Object.keys(SCAN.ids); }
// The kecamatan an address belongs to ("…, Kec. Pacet, Kabupaten Cianjur, …" -> "Pacet").
function areaOf(addr){
  var m = /Kec\.?\s*([A-Za-z'\u00C0-\u024F][A-Za-z'\u00C0-\u024F .]{2,22})(?:,|$)/.exec(String(addr || ''));
  return m ? m[1].trim() : '';
}
function scanRemember(list, items, areaLabel){
  var fresh = 0;
  (list || []).forEach(function(id){ if(id && !SCAN.ids[id]){ SCAN.ids[id] = 1; fresh++; } });
  (items || []).forEach(function(it){
    var a = areaOf(it.address);
    if(a) SCAN.near[a] = Date.now();
  });
  if(areaLabel) SCAN.done[areaLabel] = Date.now();
  saveScan();
  cloud.push('scans', { blob: JSON.stringify(SCAN) });
  return fresh;
}
function scanMerge(blob){
  try{
    var s = JSON.parse(blob || '{}');
    Object.keys(s.ids || {}).forEach(function(k){ SCAN.ids[k] = 1; });
    Object.keys(s.near || {}).forEach(function(k){ SCAN.near[k] = Math.max(SCAN.near[k] || 0, s.near[k] || 0); });
    Object.keys(s.done || {}).forEach(function(k){ if(!SCAN.done[k]) SCAN.done[k] = s.done[k]; });
    saveScan();
  }catch(e){}
}
// Kecamatan seen in the results but never searched on their own: the "locations nearby" list.
function nearbyAreas(){
  var out = [];
  Object.keys(SCAN.near).forEach(function(name){
    var done = Object.keys(SCAN.done).some(function(a){ return a.toLowerCase().indexOf(name.toLowerCase()) >= 0; });
    if(!done) out.push([name, SCAN.near[name]]);
  });
  out.sort(function(a, b){ return b[1] - a[1]; });
  return out.slice(0, 8);
}
// A bulk sender (WA Hero Sender, Wablas, ...) needs a list of name + number + the exact message.
// Everything the app already holds goes into one CSV, one row per business, personalized text included.
function csvCell(v){
  var t = String(v == null ? '' : v);
  return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
function exportCat(cid){
  var c = S.cats[cid];
  if(!c) return;
  var rows = [['nama','nomor','pesan']];
  Object.keys(S.biz).forEach(function(id){
    var b = S.biz[id];
    if(b.categoryId !== cid) return;
    var msg = b.msg || '';
    if(!msg){ try{ msg = template(b.name, c.name); }catch(e){ msg = ''; } }
    rows.push([b.name || '', normPhone(b.phone) || b.phone || '', msg]);
  });
  if(rows.length < 2){ toast('Nothing to export'); return; }
  var csv = rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
  var blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8' });   // BOM: Excel reads Indonesian text
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = String(c.name || 'leads').replace(/[^\w\-]+/g, '-').toLowerCase() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
  buzz(10);
  toast((rows.length - 1) + ' rows exported');
}

function findSheet(){
  var radii = [1000,3000,5000,10000].map(function(r){

  var pre = (cur && cur !== TRASH && S.cats[cur]) ? S.cats[cur].name : F.q;
  openSheet('<div class="sh-title">Find numbers</div>'+
    '<input class="sh-input" id="fArea" placeholder="Area" autocomplete="off" enterkeyhint="next" value="'+esc(F.area)+'">'+
    '<input class="sh-input" id="fQ" placeholder="What" autocomplete="off" enterkeyhint="done" value="'+esc(pre)+'">'+
    '<div class="chips">'+radii+'</div>'+
    '<button class="sh-btn" id="fGo">Search</button>', true);
  var areaEl = document.getElementById('fArea'), qEl = document.getElementById('fQ');
  function bad(el, msg){

    setTimeout(function(){ openFind(); }, 140);

  document.getElementById('fGo').onclick = go;
  qEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') go(); });
}
function openFind(){
  F.from = cur;
  document.getElementById('findTitle').textContent = F.q;
  document.getElementById('hits').innerHTML = '';
  document.getElementById('findSub').textContent = 'Searching…';
  document.getElementById('fab').classList.add('hide');
  document.getElementById('fabFind').classList.add('hide');
  show('find');
  try{ history.pushState({ v:'find' }, ''); }catch(e){}
  startFind(true);
}
var FIND_MAX = 100;           // numbers per search, walked until this many or the area runs out
function startFind(fresh){
  if(F.busy) return;
  F.busy = true;
  if(fresh){ F.items = []; F.more = false; F.next = 0; F.scanned = 0; F.withSite = 0; F.again = 0; F.areas = []; }
  var sub = document.getElementById('findSub');
  document.getElementById('findMore').classList.add('hide');
  var url = '/api/sweep';
  var cfg = (window.APP_CONFIG && window.APP_CONFIG.firebase) || {};
  var payload = { q:F.q, r:F.r, max:FIND_MAX, skip:scanIds() };
  // ...and every number already saved (any category, Trash included) so results are only new ones
  payload.have = Object.keys(S.biz).map(function(id){ return normPhone(S.biz[id].phone); })
    .filter(Boolean).slice(0, 800);
  if(F.area) payload.area = F.area;
  if(F.lat != null){ payload.lat = F.lat; payload.lng = F.lng; }
  if(cfg.projectId) payload.projectId = cfg.projectId;      // where the scan memory lives
  if(cfg.apiKey) payload.firebaseKey = cfg.apiKey;
  fetch(url, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(payload) })
    .then(function(r){ return r.json(); }).then(function(j){
    F.busy = false;
    if(!j || j.error){
      sub.textContent = (j && j.quota) ? 'Google daily limit reached — try again later' : ((j && j.error) || 'Search failed');
      return;
    }
    if(j.items && j.items.length && !F.lat){
      var first = j.items[0];
      if(first && first.lat){ F.lat = first.lat; F.lng = first.lng; }
    }
    scanRemember(j.ids, j.items, null);                // this ground is covered now
    F.items = F.items.concat(j.items || []);
    F.scanned = (F.scanned || 0) + (j.scanned || 0);   // places looked at, numbers or not
    F.withSite = (F.withSite || 0) + (j.withSite || 0); // skipped: they already have a website
    F.again = (F.again || 0) + (j.again || 0);          // places this app had already scanned
    F.googleDown = !!j.googleDown;                      // Google's daily quota is spent
    F.here = (F.here || 0) + (j.here || 0);             // numbers that came from the HERE fallback
    F.areas = (F.areas || []).concat(j.areas || []);
    F.more = !!j.more;
    renderHits();
  }, function(){ F.busy = false; sub.textContent = 'No connection'; });
}
function renderHits(){
  var box = document.getElementById('hits'), sub = document.getElementById('findSub');
  var skipped = (F.scanned || 0) - F.items.length - (F.withSite || 0);
  sub.textContent = F.items.length + ' numbers' +
    ((F.areas && F.areas.length) ? (' · ' + F.areas.join(', ')) : '') +
    (F.withSite ? (' · ' + F.withSite + ' with website') : '') +
    (F.again ? (' · ' + F.again + ' scanned before') : '') +
    (F.here ? (' · ' + F.here + ' via HERE') : '') +
    (F.googleDown ? ' · Google quota out' : '') +
    (skipped > 0 ? (' · ' + skipped + ' no number') : '');
  box.innerHTML = F.items.map(function(h, i){
    var dup = findDup(h.phone, null);
    return '<div class="row">'+
      '<span class="grow"><span class="bname'+(isRTL(h.name) ? ' rtl' : '')+'">'+esc(h.name)+
      (h.site === 'social' ? '<span class="tag">ig</span>' : '')+'</span>'+
      '<span class="bphone num">'+esc(h.phone + (h.km ? (' · ' + h.km + ' km') : ''))+'</span></span>'+
      '<button class="ico add'+(dup ? ' done' : '')+'" data-add="'+i+'" aria-label="Save">'+(dup ? I.check : I.plus)+'</button>'+
    '</div>';
  }).join('') || '<div class="empty">No numbers here</div>';
  document.getElementById('findMore').classList.toggle('hide', !F.more);
  releaseRows();
}
function pickCategory(i){
  F.pick = i;
  var rows = S.order.map(function(id){ return S.cats[id]; }).filter(Boolean).map(function(c){
    return '<div class="sh-row" data-pick="'+c.id+'"><span class="cname'+(isRTL(c.name) ? ' rtl' : '')+'">'+esc(c.name)+'</span></div>';

    '<div class="sh-row" data-picknew="1">'+I.plus+'<span class="cname">'+esc(F.q)+'</span></div>');
}
function saveHit(i, catId){
  var h = F.items[i], c = S.cats[catId];
  if(!h || !c || !h.phone) return;
  var b = { id:uid('b_'), name:h.name, phone:h.phone, categoryId:catId, createdAt:Date.now() };
  S.biz[b.id] = b; save(); cloud.push('businesses', b);
  renderHits(); buzz(); toast('Saved · ' + c.name);
  genMessage(b);
}
function addHit(i){
  var h = F.items[i];
  if(!h || !h.phone) return;
  var dup = findDup(h.phone, null);
  if(dup){ buzz(24); toast('Already in ' + catNameOf(dup.categoryId)); renderHits(); return; }
  if(cur && cur !== TRASH){ saveHit(i, cur); return; }
  pickCategory(i);
}

/* boot */
tidy();
renderHome();
cloud.pull().then(function(pulled){ if(pulled){ tidy(); rerender(); } cloud.flush(); genBacklog(4); });

/* keep every device on the cloud's version - the cloud is the truth, the phone is a cache */
var syncing = false, syncTimer = null;
function syncNow(force){
  if(!cloud.on() || syncing || sheetOpen) return;
  if(document.hidden && !force) return;      // no background polling
  syncing = true;
  Promise.resolve(cloud.flush())
    .then(function(){ return cloud.pull(); })
    .then(function(pulled){
      syncing = false;
      if(pulled){ tidy(); rerender(true); }
      genBacklog(5);                 // keep filling in any messages still missing
    }, function(){ syncing = false; });
}
function syncSoon(){ clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 500); }
setInterval(syncNow, 20000);                                             // while the app is open
document.addEventListener('visibilitychange', function(){ if(!document.hidden) syncSoon(); });
window.addEventListener('focus', syncSoon);
window.addEventListener("online", function(){ cloud.flush(); syncSoon(); });
setTimeout(function(){ syncNow(true); }, 2500);   // first sync right after boot
window.__sync = { now:syncNow, soon:syncSoon, syncing:function(){ return syncing; } };

/* small debug handle */
window.leads = { get state(){ return S; }, find:F, openFind:openFind, findSheet:findSheet, refresh:function(){ S = load(); renderHome(); }, waUrl:waUrl, normPhone:normPhone, validPhone:validPhone, template:template, cloud:cloud, tidy:tidy, rerender:rerender, genBacklog:genBacklog };
})();
